minimumReleaseAgeExclude:
  - lucide-react@1.75.0

# next@15 pins postcss 8.4.31, which has open advisories (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849,
# GHSA-fxqj-rqcc-2cmp, GHSA-qx2v-qp2m-jg93). Next only runs it at build time over our own CSS, but
# the audit gate is meant to stay green honestly: 8.5 is a drop-in, and this dedupes onto the copy
# Tailwind already uses. Remove once Next ships a patched postcss.
overrides:
  'next>postcss': ^8.5.23
